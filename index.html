<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WBC for Me — Find Your Team's Players</title>
  <meta name="description" content="See which players from your favorite MLB team are playing in the World Baseball Classic today.">

  <!-- Open Graph -->
  <meta property="og:title" content="WBC for Me — Find Your Team's Players">
  <meta property="og:description" content="See which players from your favorite MLB team are playing in the World Baseball Classic today.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wbcforme.com">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="WBC for Me — Find Your Team's Players">
  <meta name="twitter:description" content="See which players from your favorite MLB team are playing in the World Baseball Classic today.">

  <!-- Other -->
  <link rel="canonical" href="https://wbcforme.com">
  <meta name="theme-color" content="#1a1a2e">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "WBC for Me",
    "url": "https://wbcforme.com",
    "description": "See which players from your favorite MLB team are playing in the World Baseball Classic today.",
    "applicationCategory": "SportsApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script
    src="https://cdn.telemetrydeck.com/websdk/telemetrydeck.min.js"
    data-app-id="96D700D3-5F10-4BFB-BAAE-63A484584A7D"
    defer
  ></script>
</head>
<body>
  <div id="app">
    <!-- Loading State -->
    <div id="loading-screen" class="screen active">
      <div class="loading-content">
        <div class="loading-diamond">
          <div class="diamond-shape"></div>
        </div>
        <p class="loading-text">Loading WBC data<span class="loading-dots"></span></p>
      </div>
    </div>

    <!-- Team Selection Screen -->
    <div id="team-select-screen" class="screen">
      <header class="select-header">
        <h1 class="site-title">WBC for Me <button class="info-btn" aria-label="About"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M9 8v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="5.5" r="1" fill="currentColor"/></svg></button></h1>
        <p class="site-subtitle">Which MLB team's players do you want to follow?</p>
      </header>
      <div id="team-grid" class="team-grid"></div>
    </div>

    <!-- Team View Screen -->
    <div id="team-view-screen" class="screen">
      <header class="team-header">
        <div class="team-header-top-row">
          <button id="back-btn" class="back-btn" aria-label="Change team">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="btn-label">All Teams</span>
          </button>
          <span class="site-title-sm">WBC for Me <button class="info-btn info-btn-sm" aria-label="About" ><svg width="14" height="14" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M9 8v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="5.5" r="1" fill="currentColor"/></svg></button></span>
        </div>
        <div class="team-identity">
          <div id="team-badge-header" class="team-badge-sm"></div>
          <h2 id="team-name-header" class="team-name-display"></h2>
        </div>
        <div id="player-count" class="player-count"></div>
      </header>

      <div class="date-bar">
        <button id="prev-day" class="date-nav" aria-label="Previous day">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 4L6 9L11 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="date-display">
          <input type="date" id="date-input" class="date-input">
          <span id="date-label" class="date-label"></span>
        </div>
        <button id="next-day" class="date-nav" aria-label="Next day">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M7 4L12 9L7 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="calendar-toggle" class="date-nav" aria-label="Open calendar">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M2 7h14" stroke="currentColor" stroke-width="1.5"/><path d="M6 1v4M12 1v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="calendar-dropdown" class="calendar-dropdown"></div>

      <main id="games-container" class="games-container"></main>
    </div>

    <!-- Roster Screen -->
    <div id="roster-screen" class="screen">
      <header class="team-header">
        <div class="team-header-top-row">
          <button id="roster-back-btn" class="back-btn" aria-label="Back to schedule">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="btn-label">Schedule</span>
          </button>
          <span class="site-title-sm">WBC for Me <button class="info-btn info-btn-sm" aria-label="About" ><svg width="14" height="14" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M9 8v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="5.5" r="1" fill="currentColor"/></svg></button></span>
        </div>
        <div class="team-identity">
          <div id="roster-badge" class="team-badge-sm"></div>
          <h2 id="roster-team-name" class="team-name-display"></h2>
        </div>
        <div id="roster-subtitle" class="player-count"></div>
      </header>
      <main id="roster-container" class="roster-container"></main>
    </div>

    <!-- About Screen -->
    <div id="about-screen" class="screen">
      <div class="about-content">
        <button class="about-back-btn" id="about-back-btn" aria-label="Go back">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back
        </button>
        <div class="about-card">
          <h2>About</h2>
          <p>WBC for Me was built by joshular, an indie developer based on Whidbey Island in Washington state. If you have any feedback or questions you can contact him <a href="mailto:joshular@proton.me">here</a>.</p>
        </div>
      </div>
    </div>

    <!-- Error State -->
    <div id="error-screen" class="screen">
      <div class="error-content">
        <p class="error-icon">!</p>
        <h2>Unable to load WBC data</h2>
        <p id="error-message" class="error-detail"></p>
        <button id="retry-btn" class="retry-btn">Try Again</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
